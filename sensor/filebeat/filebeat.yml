filebeat.inputs:
  - type: filestream
    id: cowrie
    paths: [/logs/cowrie/*.json]
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}", honeypot_id: cowrie-01, honeypot_type: ssh_telnet}
  - type: filestream
    id: custom-honeypots
    paths: [/logs/custom/*.jsonl]
    fields_under_root: false
    fields: {sensor_id: "${SENSOR_ID}", sensor_ip: "${SENSOR_IP}"}
processors:
  - add_fields: {target: observer, fields: {name: "${HONEYPOT_HOSTNAME}", type: honeypot_sensor}}
queue.disk:
  max_size: 512MB
  path: /usr/share/filebeat/data/diskqueue
output.logstash:
  hosts: ["${ANALYSIS_HOST}:${LOGSTASH_PORT}"]
logging.level: info
