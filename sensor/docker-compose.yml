name: trapsig-sensor
x-hardened: &hardened
  build: {context: ./honeypots}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 64
  mem_limit: 64m
  cpus: 0.25
  volumes: [custom-logs:/logs]
services:
  custom-logs-init:
    build: {context: ./honeypots}
    user: root
    command: [chown, -R, "10001:10001", /logs]
    volumes: [custom-logs:/logs]
    restart: "no"
  cowrie:
    image: cowrie/cowrie:latest
    restart: unless-stopped
    ports: ["2222:2222", "2223:2223"]
    volumes:
      - cowrie-logs:/cowrie/cowrie-git/var/log/cowrie
      - ./honeypots/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./honeypots/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt:ro
      - ./honeypots/cowrie/honeyfs/etc/hostname:/cowrie/cowrie-git/honeyfs/etc/hostname:ro
      - ./honeypots/cowrie/honeyfs/etc/hosts:/cowrie/cowrie-git/honeyfs/etc/hosts:ro
      - ./honeypots/cowrie/honeyfs/etc/issue:/cowrie/cowrie-git/honeyfs/etc/issue:ro
      - ./honeypots/cowrie/honeyfs/etc/issue.net:/cowrie/cowrie-git/honeyfs/etc/issue.net:ro
      - ./honeypots/cowrie/honeyfs/etc/motd:/cowrie/cowrie-git/honeyfs/etc/motd:ro
      - ./honeypots/cowrie/honeyfs/etc/os-release:/cowrie/cowrie-git/honeyfs/etc/os-release:ro
      - ./honeypots/cowrie/honeyfs/etc/passwd:/cowrie/cowrie-git/honeyfs/etc/passwd:ro
      - ./honeypots/cowrie/honeyfs/etc/group:/cowrie/cowrie-git/honeyfs/etc/group:ro
      - ./honeypots/cowrie/honeyfs/etc/resolv.conf:/cowrie/cowrie-git/honeyfs/etc/resolv.conf:ro
      - ./honeypots/cowrie/honeyfs/etc/network/interfaces:/cowrie/cowrie-git/honeyfs/etc/network/interfaces:ro
      - ./honeypots/cowrie/honeyfs/proc/version:/cowrie/cowrie-git/honeyfs/proc/version:ro
      - ./honeypots/cowrie/honeyfs/proc/cpuinfo:/cowrie/cowrie-git/honeyfs/proc/cpuinfo:ro
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5
    healthcheck: {test: [CMD, /cowrie/cowrie-env/bin/python, -c, "import sys; p='08AE'; sys.exit(0 if any(x.split()[1].endswith(':'+p) and x.split()[3]=='0A' for x in open('/proc/net/tcp').readlines()[1:]) else 1)"], interval: 30s, timeout: 5s, retries: 3}
  camera:
    <<: *hardened
    environment: {SERVICE: camera, PROTOCOL: http, PORT: "8081", LOG_PATH: /logs/camera.jsonl}
    ports: ["8081:8081"]
    depends_on: {custom-logs-init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, python, /usr/local/bin/healthcheck.py], interval: 30s, timeout: 5s, retries: 3}
  iot-service:
    <<: *hardened
    environment: {SERVICE: iot-service, PROTOCOL: tcp, PORT: "9000", LOG_PATH: /logs/iot-service.jsonl}
    ports: ["9000:9000"]
    depends_on: {custom-logs-init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, python, /usr/local/bin/healthcheck.py], interval: 30s, timeout: 5s, retries: 3}
  mqtt:
    <<: *hardened
    environment: {SERVICE: mqtt, PROTOCOL: mqtt, PORT: "1883", LOG_PATH: /logs/mqtt.jsonl}
    ports: ["1883:1883"]
    depends_on: {custom-logs-init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, python, /usr/local/bin/healthcheck.py], interval: 30s, timeout: 5s, retries: 3}
  router:
    <<: *hardened
    environment: {SERVICE: router, PROTOCOL: http, PORT: "8080", LOG_PATH: /logs/router.jsonl}
    ports: ["8080:8080"]
    depends_on: {custom-logs-init: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD, python, /usr/local/bin/healthcheck.py], interval: 30s, timeout: 5s, retries: 3}
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.19.0
    user: root
    restart: unless-stopped
    command: [filebeat, -e, --strict.perms=false]
    environment: {SENSOR_ID: "${SENSOR_ID}", SENSOR_IP: "${SENSOR_IP}", HONEYPOT_HOSTNAME: "${HONEYPOT_HOSTNAME}", ANALYSIS_HOST: "${ANALYSIS_HOST}", LOGSTASH_PORT: "${LOGSTASH_PORT:-5044}"}
    volumes: [./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro, custom-logs:/logs/custom:ro, cowrie-logs:/logs/cowrie:ro, filebeat-data:/usr/share/filebeat/data]
    depends_on: [cowrie, camera, iot-service, mqtt, router]
    healthcheck: {test: [CMD, filebeat, test, config, -c, /usr/share/filebeat/filebeat.yml, --strict.perms=false], interval: 30s, timeout: 10s, retries: 3}
    mem_limit: 128m
volumes: {custom-logs: {}, cowrie-logs: {}, filebeat-data: {}}
