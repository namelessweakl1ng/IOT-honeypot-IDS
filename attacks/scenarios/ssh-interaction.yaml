id: ssh-interaction
name: SSH interaction
description: One Cowrie login with harmless first-stage device enumeration
trial_kind: attack
target_services:
- ssh
expected_detection: COMMAND_INTERACTION
severity: medium
steps:
- service: ssh
  username: root
  password: root
  commands:
  - hostname
  - uname -a
  - id
  - cat /etc/os-release
