id: multi-honeypot-attack
name: Multi-honeypot attack
description: Reproducible interaction across all decoys
target_services:
  - camera
  - iot
  - mqtt
  - router
  - ssh
  - telnet
expected_detection: MULTI_STAGE_ATTACK
severity: medium
steps:
  - service: ssh
    payload: "SSH-2.0-OpenSSH_8.9\r\n"
  - service: telnet
    payload: "admin\r\n"
  - service: camera
    payload: "GET / HTTP/1.1\r\nHost: camera\r\n\r\n"
  - service: iot
    payload: "STATUS\r\n"
  - service: mqtt
    payload: "\x10\x0c\x00\x04MQTT\x04\x02\x00\x0a\x00\x00"
  - service: router
    payload: "GET /admin HTTP/1.1\r\nHost: router\r\n\r\n"
