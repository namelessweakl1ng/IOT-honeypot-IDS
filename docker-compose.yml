name: trapsig-analysis
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
      - "./elk/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro,Z"
    ports: ["${LOCAL_BIND_HOST:-127.0.0.1}:9200:9200"]
    healthcheck: {test: [CMD-SHELL, "curl -fs http://localhost:9200/_cluster/health"], interval: 15s, timeout: 5s, retries: 20}
    mem_limit: 1g
  elasticsearch-setup:
    image: curlimages/curl:8.12.1
    entrypoint: ["/bin/sh", "/setup/install-templates.sh"]
    environment: {ELASTICSEARCH_URL: "http://elasticsearch:9200"}
    volumes:
      - "./elk/elasticsearch/index-templates:/templates:ro,Z"
      - "./elk/elasticsearch/setup:/setup:ro,Z"
      - "./elk/elasticsearch/mapping-upgrades:/mapping-upgrades:ro,Z"
    depends_on: {elasticsearch: {condition: service_healthy}}
    restart: "no"
  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.0
    environment: {LS_JAVA_OPTS: -Xms256m -Xmx256m}
    volumes:
      - "./elk/logstash/config:/usr/share/logstash/config:ro,Z"
      - "./elk/logstash/pipelines:/usr/share/logstash/pipeline:ro,Z"
    ports: ["${BEATS_BIND_HOST:-0.0.0.0}:5044:5044", "${LOCAL_BIND_HOST:-127.0.0.1}:9600:9600"]
    depends_on: {elasticsearch-setup: {condition: service_completed_successfully}}
    healthcheck: {test: [CMD-SHELL, "curl -fs http://localhost:9600/_node/pipelines"], interval: 15s, timeout: 5s, retries: 20}
    mem_limit: 512m
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.0
    environment:
      NODE_OPTIONS: "--max-old-space-size=768"
    volumes:
      - "./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro,Z"
    ports: ["${LOCAL_BIND_HOST:-127.0.0.1}:5601:5601"]
    depends_on: {elasticsearch: {condition: service_healthy}}
    healthcheck: {test: [CMD-SHELL, "curl -fs http://localhost:5601/api/status"], interval: 20s, timeout: 10s, retries: 20}
    # Kibana's optimized bundles exceeded 768 MiB in the physical Fedora deployment.
    mem_limit: 1536m
  kibana-setup:
    image: curlimages/curl:8.12.1
    volumes:
      - "./elk/kibana/saved-objects/trapsig.ndjson:/assets/trapsig.ndjson:ro,Z"
    depends_on: {kibana: {condition: service_healthy}}
    command: ["-fsS", "-H", "kbn-xsrf:true", "-F", "file=@/assets/trapsig.ndjson", "http://kibana:5601/api/saved_objects/_import?overwrite=true"]
    restart: "no"
  backend:
    build: ./backend
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      KIBANA_URL: ${KIBANA_URL:-http://localhost:5601}
      PI_HOST: ${PI_HOST:-}
      PI_USER: ${PI_USER:-trapsig}
      PI_SSH_KEY: /home/trapsig/.ssh/pi_ssh_key
      PI_KNOWN_HOSTS: /home/trapsig/.ssh/known_hosts
      LAB_SUBNET: ${LAB_SUBNET:-192.168.50.0/24}
      SCENARIO_DIR: /app/scenarios
      TRAPSIG_REVISION: ${TRAPSIG_REVISION:-}
      EXPERIMENT_SETTLE_TIMEOUT_SECONDS: ${EXPERIMENT_SETTLE_TIMEOUT_SECONDS:-25}
      EXPERIMENT_SETTLE_QUIET_SECONDS: ${EXPERIMENT_SETTLE_QUIET_SECONDS:-3}
      EXPERIMENT_SETTLE_POLL_SECONDS: ${EXPERIMENT_SETTLE_POLL_SECONDS:-1}
    ports: ["${LOCAL_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"]
    volumes:
      - "${PI_SSH_KEY_PATH:-./secrets/pi_ssh_key}:/run/trapsig-secrets/pi_ssh_key:ro,Z"
      - "${PI_KNOWN_HOSTS_PATH:-./secrets/known_hosts}:/run/trapsig-secrets/known_hosts:ro,Z"
      - "./attacks/scenarios:/app/scenarios:ro,Z"
    depends_on: {elasticsearch: {condition: service_healthy}, logstash: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 15s, timeout: 5s, retries: 10}
    mem_limit: 256m
  frontend:
    build:
      context: ./frontend
    environment: {API_URL: "http://backend:8000", HOSTNAME: "0.0.0.0"}
    ports: ["${LOCAL_BIND_HOST:-127.0.0.1}:3000:3000"]
    depends_on: {backend: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, -q, --spider, "http://127.0.0.1:3000/"], interval: 15s, timeout: 5s, retries: 10}
    mem_limit: 256m
volumes: {elastic-data: {}}
