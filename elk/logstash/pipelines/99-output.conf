filter { if "_trapsig_parse_failure" not in [tags] { mutate { remove_field => ["raw","agent","ecs","host","input","log","fields"] } } }
output {
  if "_trapsig_parse_failure" in [tags] { elasticsearch { hosts => ["http://elasticsearch:9200"] index => "trapsig-dead-letter-%{+YYYY.MM.dd}" } }
  else { elasticsearch { hosts => ["http://elasticsearch:9200"] index => "trapsig-events-%{+YYYY.MM.dd}" document_id => "%{[event][id]}" } }
}
