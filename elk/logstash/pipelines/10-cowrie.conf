filter { if [fields][honeypot_type] == "ssh_telnet" and "_trapsig_parse_failure" not in [tags] {
  mutate { add_field => { "[event][id]" => "%{[raw][eventid]}-%{[raw][session]}" "[service][name]" => "cowrie" "[honeypot][id]" => "%{[fields][honeypot_id]}" "[honeypot][type]" => "ssh_telnet" "[observer][type]" => "honeypot_sensor" "[trapsig][sensor_id]" => "%{[fields][sensor_id]}" "[source][ip]" => "%{[raw][src_ip]}" "[source][port]" => "%{[raw][src_port]}" "[destination][port]" => "%{[raw][dst_port]}" "[network][transport]" => "tcp" "[network][protocol]" => "ssh" } }
  if [raw][eventid] =~ /login/ { mutate { add_field => { "[event][category]" => "authentication" "[event][action]" => "login_attempt" } } } else { mutate { add_field => { "[event][category]" => "session" "[event][action]" => "%{[raw][eventid]}" } } }
  date { match => ["[raw][timestamp]","ISO8601"] target => "@timestamp" }
} }
