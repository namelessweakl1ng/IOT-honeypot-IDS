filter { if [fields][honeypot_type] != "ssh_telnet" and "_trapsig_parse_failure" not in [tags] {
  mutate { add_field => { "[event][id]" => "%{[raw][event_id]}" "[event][category]" => "%{[raw][category]}" "[event][type]" => "%{[raw][type]}" "[event][action]" => "%{[raw][action]}" "[event][outcome]" => "%{[raw][outcome]}" "[source][ip]" => "%{[raw][source_ip]}" "[source][port]" => "%{[raw][source_port]}" "[destination][port]" => "%{[raw][destination_port]}" "[network][transport]" => "tcp" "[network][protocol]" => "%{[raw][protocol]}" "[service][name]" => "%{[raw][service]}" "[honeypot][id]" => "%{[raw][honeypot_id]}" "[honeypot][type]" => "%{[raw][honeypot_type]}" "[observer][type]" => "honeypot_sensor" "[trapsig][sensor_id]" => "%{[fields][sensor_id]}" "message" => "%{[raw][summary]}" } }
  date { match => ["[raw][timestamp]","ISO8601"] target => "@timestamp" }
} }
