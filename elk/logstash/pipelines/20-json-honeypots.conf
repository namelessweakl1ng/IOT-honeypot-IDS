filter {
  if [fields][honeypot_type] != "ssh_telnet" and "_trapsig_parse_failure" not in [tags] {
    mutate { add_field => {
      "[event][id]" => "%{[raw][event_id]}" "[event][category]" => "%{[raw][category]}"
      "[event][type]" => "%{[raw][type]}" "[event][action]" => "%{[raw][action]}"
      "[event][outcome]" => "%{[raw][outcome]}" "[source][ip]" => "%{[raw][source_ip]}"
      "[source][port]" => "%{[raw][source_port]}" "[destination][port]" => "%{[raw][destination_port]}"
      "[destination][ip]" => "%{[fields][sensor_ip]}"
      "[network][transport]" => "tcp" "[network][protocol]" => "%{[raw][protocol]}"
      "[service][name]" => "%{[raw][service]}" "[honeypot][id]" => "%{[raw][honeypot_id]}"
      "[honeypot][type]" => "%{[raw][honeypot_type]}" "[observer][type]" => "honeypot_sensor"
      "[trapsig][sensor_id]" => "%{[fields][sensor_id]}" "message" => "%{[raw][summary]}"
    } }
    if [raw][url][path] { mutate { add_field => { "[url][path]" => "%{[raw][url][path]}" } } }
    if [raw][http][request][method] { mutate { add_field => { "[http][request][method]" => "%{[raw][http][request][method]}" } } }
    if [raw][http][user_agent] { mutate { add_field => { "[http][user_agent]" => "%{[raw][http][user_agent]}" } } }
    if [raw][authentication][username] { mutate { add_field => { "[authentication][username]" => "%{[raw][authentication][username]}" "[authentication][password]" => "%{[raw][authentication][password]}" } } }
    ruby {
      code => '
        mqtt = event.get("[raw][mqtt]")
        if mqtt.is_a?(Hash)
          %w[operation packet_type flags remaining_length client_id protocol_level connect_flags keep_alive username_present password_present packet_id topic qos requested_qos].each do |field|
            value = mqtt[field]
            event.set("[mqtt][#{field}]", value) unless value.nil?
          end
        end
        operation = event.get("[raw][iot][operation]")
        event.set("[iot][operation]", operation) unless operation.nil?
      '
    }
    date { match => ["[raw][timestamp]", "ISO8601"] target => "@timestamp" }
  }
}
