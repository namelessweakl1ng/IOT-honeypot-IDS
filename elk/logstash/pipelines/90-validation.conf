filter {
  if "_trapsig_parse_failure" in [tags] {
    mutate {
      add_field => {
        "[trapsig][dead_letter_reason]" => "json_parse_failure"
        "[raw][original]" => "%{[@metadata][trapsig_original]}"
      }
    }
  } else {
    ruby {
      init => 'require "ipaddr"'
      code => '
        event.set("[event][ingested]", LogStash::Timestamp.now)
        event.set("[trapsig][schema_version]", "1")
        reason = event.get("tags").to_a.include?("_dateparsefailure") ? "invalid_timestamp" : nil

        required = {"@timestamp"=>"timestamp", "[event][id]"=>"event_id", "[event][category]"=>"event_category", "[event][type]"=>"event_type", "[event][action]"=>"event_action", "[event][outcome]"=>"event_outcome", "[source][ip]"=>"source_ip", "[destination][ip]"=>"destination_ip", "[network][transport]"=>"network_transport", "[network][protocol]"=>"network_protocol", "[service][name]"=>"service_name", "[honeypot][id]"=>"honeypot_id", "[honeypot][type]"=>"honeypot_type", "[trapsig][sensor_id]"=>"sensor_id", "[trapsig][schema_version]"=>"schema_version"}
        required.each do |field, label|
          value = event.get(field)
          if value.nil? || value.to_s.empty?
            reason ||= "missing_#{label}"; break
          elsif value.to_s.include?("%{")
            reason ||= "unresolved_interpolation"; break
          end
        end

        source = event.get("[source][ip]").to_s
        destination = event.get("[destination][ip]").to_s
        begin; source_ip = IPAddr.new(source); rescue; reason ||= "invalid_source_ip"; end
        begin; IPAddr.new(destination); rescue; reason ||= "invalid_destination_ip"; end
        internal = !source_ip.nil? && (IPAddr.new("127.0.0.0/8").include?(source_ip) || source_ip == IPAddr.new("::1"))
        event.set("[trapsig][internal]", internal)
        event.set("[trapsig][internal_reason]", "loopback_source") if internal

        allowed = {"[event][category]"=>%w[authentication network web process session], "[event][type]"=>%w[connection start end info error], "[event][outcome]"=>%w[success failure unknown]}
        allowed.each { |field, values| reason ||= "invalid_#{field.gsub(/[^a-z]/, "_").gsub(/_+/, "_").sub(/^_/, "")}" unless values.include?(event.get(field)) }
        ["[source][port]", "[destination][port]", "[mqtt][packet_type]"].each do |field|
          next if event.get(field).nil? || event.get(field).to_s.empty?
          begin
            value = Integer(event.get(field)); raise unless value >= 0 && (field.include?("packet_type") || value <= 65535)
            event.set(field, value)
          rescue
            reason ||= field.include?("packet_type") ? "invalid_mqtt_packet_type" : "invalid_port"
          end
        end
        if reason
          event.tag("_trapsig_validation_failure")
          event.set("[trapsig][dead_letter_reason]", reason)
        end
      '
    }
  }
}
