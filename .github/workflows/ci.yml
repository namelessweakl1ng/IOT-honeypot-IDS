name: TRAPSIG CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trapsig-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            attacks/requirements.txt
            requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt -r attacks/requirements.txt -r requirements-dev.txt
      - run: python -m ruff check backend attacks evaluation tests
      - run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate resolved Compose mounts
        run: docker compose config --format json | python scripts/ci/check-compose-mounts.py
      - run: docker compose -f sensor/docker-compose.yml --env-file sensor/.env.example config --quiet
      - run: ./scripts/ci/check-shell.sh

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - run: docker build --tag trapsig-honeypot-ci sensor/honeypots

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run Elasticsearch, Logstash, and backend smoke checks
        run: ./scripts/ci/integration-smoke.sh
      - name: Print service diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color
      - name: Clean up containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
