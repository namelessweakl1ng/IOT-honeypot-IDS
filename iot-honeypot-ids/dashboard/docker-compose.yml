# =====================================================================
# Computer 1 — ELK + FastAPI + React + ML pipeline
# =====================================================================
name: iot-honeypot-dashboard

networks:
  elk:
    driver: bridge
  analysis:
    driver: bridge

volumes:
  es_data:
  logstash_pipeline:
  kibana_data:
  api_data:

services:
  # -----------------------------------------------------------------
  # Elasticsearch
  # -----------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELK_VERSION:-8.13.4}
    container_name: pc1-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.security.authc.api_key.enabled=true
      - xpack.security.transport.ssl.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:- -Xms2g -Xmx2g}
      - cluster.name=iot-honeypot
      - node.name=pc1-es-01
      - bootstrap.memory_lock=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - ./elasticsearch/index-templates:/usr/share/elasticsearch/config/index-templates:ro
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - elk
    healthcheck:
      test:
        - CMD-SHELL
        - "curl -s -u elastic:${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health | grep -q '\"status\":\"\\(green\\|yellow\\)\"'"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # -----------------------------------------------------------------
  # Logstash — receives Beats from Pi, parses JSON, normalizes ECS,
  # indexes into appropriate indices, and routes malformed events
  # to a dedicated dead-letter index.
  # -----------------------------------------------------------------
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.13.4}
    container_name: pc1-logstash
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=${LS_JAVA_OPTS:- -Xms1g -Xmx1g}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - LOGSTASH_SYSTEM_PASSWORD=${LOGSTASH_SYSTEM_PASSWORD}
      - LOGSTASH_BEATS_PASSWORD=${LOGSTASH_BEATS_PASSWORD}
      - XPACK_MONITORING_ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_MONITORING_ELASTICSEARCH_USERNAME=elastic
      - XPACK_MONITORING_ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - XPACK_MONITORING_ENABLED=false
    volumes:
      - ./logstash/pipelines:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/config/pipelines.yml:/usr/share/logstash/config/pipelines.yml:ro
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_HTTP_PORT:-9600}:9600"
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600/_node/stats | grep -q '\"logstash\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # -----------------------------------------------------------------
  # Kibana
  # -----------------------------------------------------------------
  kibana:
    image: docker.elastic.co/kibana/kibana:${ELK_VERSION:-8.13.4}
    container_name: pc1-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
      - XPACK_SECURITY_ENCRYPTIONKEY=${API_SECRET_KEY}
      - SERVER_NAME=pc1-kibana
      - SERVER_HOST=0.0.0.0
      - I18N_LOCALE=en
    volumes:
      - ./kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
      - ./kibana/saved-objects:/usr/share/kibana/saved-objects:ro
      - kibana_data:/usr/share/kibana/data
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    networks:
      - elk
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"state\":\"green\"' || curl -sf http://localhost:5601/ >/dev/null || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # -----------------------------------------------------------------
  # FastAPI service — sessions / detections / models / experiments
  # -----------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: iot-honeypot/api:local
    container_name: pc1-api
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - API_ALLOWED_CIDRS=${API_ALLOWED_CIDRS:-192.168.1.0/24,127.0.0.0/8}
      - MODEL_PATH=${MODEL_PATH:-/app/model-lab/models}
      - DATA_PATH=${DATA_PATH:-/app/data}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEFAULT_RANDOM_SEED=${DEFAULT_RANDOM_SEED:-42}
    volumes:
      - ./ml:/app/ml:ro
      - ../model-lab:/app/model-lab
      - api_data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - elk
      - analysis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
