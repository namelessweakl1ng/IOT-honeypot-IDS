# TRAPSIG Attack Simulator — configuration template
# Copy to config.yaml and edit. Never commit the real config.yaml.
# This config reuses the same conventions as attacker/.env

target:
  ip: "192.168.1.50"

lab:
  allowed_cidrs:
    - "192.168.1.0/24"

services:
  ssh:
    enabled: true
    port: 2222

  camera:
    enabled: true
    port: 8080

  iot:
    enabled: true
    port: 9000

limits:
  max_connections: 30
  max_requests: 50
  max_auth_attempts: 10
  request_delay_ms: 250
  scenario_timeout_seconds: 120

safety:
  require_private_target: true
  require_explicit_target: true
  allow_localhost: false
