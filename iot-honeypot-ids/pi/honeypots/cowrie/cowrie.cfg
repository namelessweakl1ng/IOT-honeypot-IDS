# =====================================================================
# Cowrie configuration — IoT-look-alike SSH/Telnet honeypot
# =====================================================================

[honeypot]

# Hostname the attacker will see — keep it believable for a cheap IoT device.
hostname = iot-bridge-01

# Fake /etc/os-release content (Cowrie uses ".sensor" and ".txtdata")
# The actual fake filesystem lives under honeypots/cowrie/fs/.

# Listen addresses — Cowrie listens inside the container on 0.0.0.0.
# The compose file maps host ports via COWRIE_SSH_PORT / COWRIE_TELNET_PORT.
listen_addr = 0.0.0.0
ssh_addr = 0.0.0.0
telnet_addr = 0.0.0.0

# Fake SSH version string — embedded Linux look-alike.
ssh_version_string = SSH-2.0-dropbear_2014.65

# Always start in JSON logging mode — Filebeat expects line-delimited JSON.
log_output_json = true

# Where the JSON file lives inside the container (Filebeat tails this path).
json_log_file = /var/log/cowrie/cowrie.json

# Also keep a textual log for emergency forensics inside the container only.
log_output_text = true

# Disable the ability to actually download/upload large payloads
# (we want behavioral telemetry, not large binaries on the Pi SD card).
download_path = /cowrie/cowrie-git/var/lib/cowrie/downloads
download_limit_size = 5242880   # 5 MB cap per file

# Allow only small uploads
upload_limit_size = 2097152    # 2 MB

# ---- Sessions -------------------------------------------------------
# Drop idle sessions quickly to free memory.
interactive_timeout = 180
session_timeout = 300

# ---- Authentication -------------------------------------------------
# Credentials that "succeed" — defined in userdb.txt
# Anything else fails with a believable auth error.
auth_class = AuthRandom
auth_class_parameters = root, admin, root, 123456, root, password, admin, admin, ubuntu, ubuntu

# Reject too-fast brute force (we still log it, but disconnect quickly)
max_attempts = 7

# ---- Backend commands ----------------------------------------------
# Cowrie's "real" commands are simulated via its fake filesystem + python
# backend. We keep the default backend but cap interactive sessions.
shell = cowrie.shell.HoneyPotShell

# ---- Output modules ------------------------------------------------
# We disable output modules that would push large data into the Pi disk.
# Filebeat handles forwarding via the JSON file.
output_modules =
