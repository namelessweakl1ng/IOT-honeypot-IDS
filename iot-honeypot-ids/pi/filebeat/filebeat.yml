# =====================================================================
# Filebeat — ships honeypot JSON logs to PC1 Logstash
# ---------------------------------------------------------------------
# Filebeat auto-discovers the JSONL files written by the honeypots and
# ships them to the Logstash Beats input on PC1.
# Logstash then parses, normalizes (ECS-style), enriches, and indexes.
# =====================================================================

filebeat.inputs:
  # -----------------------------------------------------------------
  # Cowrie JSON log
  # -----------------------------------------------------------------
  - type: filestream
    id: cowrie-json
    paths:
      - /var/log/cowrie/cowrie.json
    parsers:
      - ndjson:
          target: cowrie
          overwrite_keys: true
          add_error_key: true
          expand_keys: true
    fields:
      honeypot: cowrie
      device.type: ssh
      source.container: pi-cowrie
    fields_under_root: false

  # -----------------------------------------------------------------
  # Camera honeypot JSONL log (we already write line-delimited JSON)
  # -----------------------------------------------------------------
  - type: filestream
    id: camera-jsonl
    paths:
      - /var/log/camera/camera.jsonl
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
          expand_keys: false
    fields:
      honeypot: camera
      device.type: camera
      source.container: pi-camera
    fields_under_root: false

  # -----------------------------------------------------------------
  # IoT service JSONL log
  # -----------------------------------------------------------------
  - type: filestream
    id: iot-jsonl
    paths:
      - /var/log/iot/iot.jsonl
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
          expand_keys: false
    fields:
      honeypot: iot-service
      device.type: iot_service
      source.container: pi-iot-service
    fields_under_root: false

# ---------------------------------------------------------------------
# Output: Logstash on PC1
# ---------------------------------------------------------------------
output.logstash:
  hosts: ["${CENTRAL_SERVER_IP}:${LOGSTASH_BEATS_PORT}"]
  # Auth is optional; if LOGSTASH_BEATS_PASSWORD is empty, ssl is off.
  # In a real lab with the lab_subnet trusted we keep this plain.
  ssl.certificate_authorities: []
  ssl.verification_mode: "none"
  worker: 1
  bulk_max_size: 1024
  pipelining: 0
  ttl: 120
  # Backoff so the Pi does not hammer PC1 when it is unreachable.
  backoff.init: 1s
  backoff.max: 30s
  max_retries: -1

# ---------------------------------------------------------------------
# Disk-backed queue — preserves events when Logstash is temporarily
# unavailable. Filebeat 8.13.4 uses `queue.disk` (NOT `queue.spool`
# which was removed in Filebeat 7.16+).
#
# When Logstash is unreachable, Filebeat retries with exponential backoff
# (configured above) and buffers events to disk. When Logstash returns,
# buffered events are forwarded. This preserves the "do not silently lose
# telemetry when Logstash is temporarily unavailable" contract.
#
# The disk queue is bounded by `max_size` to prevent filling the Pi SD card.
# ---------------------------------------------------------------------
queue:
  type: disk
  max_size: 100MB
  path: /usr/share/filebeat/data/queue

# ---------------------------------------------------------------------
# General
# ---------------------------------------------------------------------
name: pi-honeypot-shipper
tags: ["honeypot", "iot-lab"]

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 3
  permissions: 0644

# Periodic monitoring for the Pi dashboard
monitoring:
  enabled: false

# Reload inputs so we can add new honeypots without restarting
filebeat.config.reload:
  enabled: true
  period: 30s
