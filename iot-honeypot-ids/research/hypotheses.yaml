version: 2
status: PRE-REGISTRATION TEMPLATE; ALL EXPERIMENTS NOT RUN
principle: >-
  These are questions and analysis plans, not results. There are no fabricated
  expected metric values or pass thresholds. Freeze question, split, metric,
  and analysis before acquiring/evaluating evidence.
research_questions:
  - id: RQ1
    question: Can the system ingest and reconstruct controlled IoT honeypot telemetry?
    dataset: CONTROLLED_LAB
    experiment: One bounded scenario per run; trace event -> session -> features -> detector -> API.
    metric: indexed/generated event linkage, session/event linkage, invalid or duplicate record counts.
    analysis: Report numerator, denominator, time window, excluded runs, and confidence limits where meaningful.
    status: NOT_RUN
  - id: RQ2
    question: How do supported supervised models classify IoT-23 flow labels on held-out scenarios?
    dataset: PUBLIC_DATASET
    experiment: Logistic Regression, Random Forest, Gradient Boosting; SCENARIO_HOLDOUT; train-only preprocessing; validation descriptive; test once.
    metric: accuracy, balanced accuracy, macro/per-class precision-recall-F1, FPR/FNR, confusion matrix, PR-AUC/ROC-AUC where defined.
    analysis: Compare model outputs on the same recorded split; disclose classes absent from partitions and unmapped exclusions.
    status: NOT_RUN
  - id: RQ3
    question: How does benign-trained Isolation Forest flag malicious IoT-23 flows on held-out data?
    dataset: PUBLIC_DATASET
    experiment: Isolation Forest fit on benign training flows only; report scenario-held-out and/or explicitly labeled chronological split.
    metric: binary FPR/FNR, per-class precision-recall-F1, ROC-AUC and PR-AUC where test labels support them.
    analysis: Treat anomaly as a score/prediction; do not equate anomaly with malicious ground truth beyond the external dataset labels.
    status: NOT_RUN
  - id: RQ4
    question: What operational resources and stage latencies occur on the physical Pi-to-analysis pipeline?
    dataset: CONTROLLED_LAB
    experiment: Predeclared bounded campaign with synchronized clocks and repeated resource samples.
    metric: CPU, RAM, temperature, load, disk, network/container resources and T0-T9 stage timestamps.
    analysis: Report host, hardware, workload, repetitions, missing stages, clock synchronization, and observed variability.
    status: NOT_RUN
